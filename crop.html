<!DOCTYPE html>
<html>
<head>
  <title>Crop Details - M.O.O.N</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body style="background-image: url('images/indian-crops.jpg');">
<div class="overlay">
<div class="container">
<center>

<br><br>
<font size="6"><b>Crop Details</b></font>
<br><br>

<form onsubmit="searchCrop(event)">
  <input type="text" id="cropName" placeholder="Enter crop name">
  <button type="submit">Search</button>
</form>

<br>
<h3 id="result"></h3>

<br><br>
<a href="index.html"><font color="cyan">⬅ Back to Home</font></a>

</center>

<script>
const crops = {
  rice: {
    soil: "Clay soil",
    season: "Kharif",
    water: "High water requirement"
  },
  wheat: {
    soil: "Loamy soil",
    season: "Rabi",
    water: "Moderate water requirement"
  },
  maize: {
    soil: "Well-drained soil",
    season: "Kharif/Rabi",
    water: "Moderate"
  }
};

function searchCrop(event) {
  event.preventDefault();

  const name = document.getElementById("cropName").value.toLowerCase();
  const result = document.getElementById("result");

  if (crops[name]) {
    result.innerHTML =
      "Soil: " + crops[name].soil + "<br>" +
      "Season: " + crops[name].season + "<br>" +
      "Water: " + crops[name].water;
  } else {
    result.innerHTML = "Crop not found.";
  }
}
</script>

</div>
</div>
</body>

</html>
